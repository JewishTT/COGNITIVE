version: '3.8'

services:
  # ========================================================================
  # FRONTEND - Vue 3 Application
  # ========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cognitive-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://backend:8000
      - VITE_WS_URL=ws://backend:8000
    volumes:
      - ./frontend/public:/usr/share/nginx/html/public:ro
    depends_on:
      - backend
      - neo4j
      - redis
    networks:
      - cognitive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========================================================================
  # BACKEND - Node.js API Server
  # ========================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cognitive-backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super-secret-key}
      - LOG_LEVEL=info
    volumes:
      - ./backend:/app/backend:ro
      - ./backend/services/globe/cesium:/app/backend/services/globe/cesium:ro
      - ./backend/services/pipeline:/app/backend/services/pipeline:ro
      - ./backend/services/enrichers:/app/backend/services/enrichers:ro
    depends_on:
      - neo4j
      - redis
    networks:
      - cognitive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ========================================================================
  # NEO4J - Graph Database
  # ========================================================================
  neo4j:
    image: neo4j:5-community
    container_name: cognitive-neo4j
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_connector_bolt_thread__pool__max__size=200
      - NEO4J_dbms_connector_bolt_thread__pool__min__size=8
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    networks:
      - cognitive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password}", "MATCH (n) RETURN 1 LIMIT 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ========================================================================
  # REDIS - Cache & Event Bus
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: cognitive-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    networks:
      - cognitive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================================
  # GLOBE - Cesium 3D Visualization Server (Optional)
  # ========================================================================
  globe:
    image: nginx:alpine
    container_name: cognitive-globe
    ports:
      - "8080:80"
    volumes:
      - ./backend/services/globe/cesium:/usr/share/nginx/html:ro
    networks:
      - cognitive-network
    restart: unless-stopped
    profiles:
      - globe

  # ========================================================================
  # PIPELINE - Python Pipeline Worker (Optional)
  # ========================================================================
  pipeline:
    build:
      context: .
      dockerfile: backend/services/pipeline/Dockerfile
    container_name: cognitive-pipeline
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/services/pipeline:/app:ro
    depends_on:
      - neo4j
      - redis
    networks:
      - cognitive-network
    restart: unless-stopped
    profiles:
      - pipeline

  # ========================================================================
  # NGINX - Reverse Proxy (Optional)
  # ========================================================================
  nginx:
    image: nginx:alpine
    container_name: cognitive-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - globe
    networks:
      - cognitive-network
    restart: unless-stopped
    profiles:
      - nginx

# ========================================================================
# VOLUMES
# ========================================================================
volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  redis-data:

# ========================================================================
# NETWORKS
# ========================================================================
networks:
  cognitive-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
