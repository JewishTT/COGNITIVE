version: '3.9'

services:
  # ============================================================================
  # FRONTEND - 3D GLOBE (Vue + Cesium)
  # ============================================================================
  globe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: cognitive-globe
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://api:8000
      - VITE_WS_URL=ws://api:8000/ws
      - VITE_APP_NAME=COGNITIVE Platform
      - VITE_APP_VERSION=0.1.0
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - CESIUM_TOKEN=${CESIUM_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - cognitive-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # API SERVER (Express + Node.js)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        - NODE_ENV=production
    container_name: cognitive-api
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - API_PREFIX=/api/v1
      - LOG_LEVEL=info
      # Neo4j
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=neo4j
      # Redis
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0
      - CACHE_BACKEND=redis
      - CACHE_TTL=3600
      - CACHE_MAX_SIZE=1000
      # Pipeline
      - PIPELINE_URL=http://pipeline:5001
      - OSINT_URL=http://pipeline:5001
      # Service Registry
      - SERVICE_REGISTRY_HEALTH_CHECK_INTERVAL=30000
      - SERVICE_REGISTRY_CIRCUIT_BREAKER_THRESHOLD=5
      - SERVICE_REGISTRY_MAX_RETRIES=3
      # External APIs
      - OPENSKY_URL=https://opensky-network.org/api/states/all
      - OPENSKY_TIMEOUT=10000
      - CESIUM_TOKEN=${CESIUM_TOKEN:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      - TFL_APP_KEY=${TFL_APP_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      pipeline:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cognitive-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # PIPELINE SERVER (Node.js OSINT orchestrator)
  # ============================================================================
  pipeline:
    build:
      context: platform/pipeline-server
      dockerfile: Dockerfile
    container_name: cognitive-pipeline
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PIPELINE_PORT=5001
      - PIPELINE_TIMEOUT=120000
      - PIPELINE_CRAWL_MAX_PAGES=${PIPELINE_CRAWL_MAX_PAGES:-12}
      - PIPELINE_CRAWL_CONCURRENCY=${PIPELINE_CRAWL_CONCURRENCY:-4}
      - PIPELINE_CRAWL_TIMEOUT_MS=${PIPELINE_CRAWL_TIMEOUT_MS:-8000}
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - FLOWSINT_API=http://neo4j:7687
      - SEARXNG_URL=${SEARXNG_URL:-}
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cognitive-network
    volumes:
      - pipeline-work:/app/.work
      - pipeline-venv:/app/.pipeline-venv
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # NEO4J - GRAPH DATABASE
  # ============================================================================
  neo4j:
    image: neo4j:5.15-community
    container_name: cognitive-neo4j
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_connector_bolt_tls__level=DISABLED
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped
    networks:
      - cognitive-network
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', '${NEO4J_PASSWORD:-password}', 'RETURN 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ============================================================================
  # REDIS - CACHE & SESSIONS
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: cognitive-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - cognitive-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # FACTORY - SOCIAL MEDIA AUTOMATION (Optional)
  # ============================================================================
  # Uncomment to enable Postiz factory
  # factory:
  #   extends:
  #     file: platform/factory/docker-compose.yaml
  #     service: postiz
  #   container_name: cognitive-factory
  #   ports:
  #     - "4007:5000"
  #   networks:
  #     - cognitive-network
  #   depends_on:
  #     - api

volumes:
  neo4j-data:
  neo4j-logs:
  redis-data:
  pipeline-work:
  pipeline-venv:

networks:
  cognitive-network:
    driver: bridge
