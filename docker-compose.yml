version: '3.8'

# ============================================================================
# COGNITIVE PLATFORM - DOCKER COMPOSE
# ============================================================================
# 
# [38;5;240mUnified Orchestration for All Services[0m
# 
# This file orchestrates all COGNITIVE platform services:
# - Frontend (Vue 3 + Vite)
# - API Server (Node.js + Express)
# - Neo4j Database
# - Redis Cache
# - Cesium Globe Server
# - Pipeline Server
#
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose down             # Stop all services
#   docker-compose logs -f         # View logs
#   docker-compose build           # Rebuild images
#
# ============================================================================

services:
  # ==========================================================================
  # FRONTEND
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NODE_ENV=production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://api:8000
      - VITE_WS_URL=ws://api:8000
      - VITE_APP_NAME=COGNITIVE Platform
      - VITE_APP_VERSION=2.0.0
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - cognitive-network

  # ==========================================================================
  # API SERVER
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        - NODE_ENV=production
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - API_PREFIX=/api/v1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_DATABASE=neo4j
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_SECRET=cognitive-secret-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=7d
      - CESIUM_TOKEN=${CESIUM_TOKEN:-}
      - CACHE_BACKEND=hybrid
      - CACHE_TTL=3600
      - LOG_LEVEL=info
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped
    networks:
      - cognitive-network

  # ==========================================================================
  # NEO4J DATABASE
  # ==========================================================================
  neo4j:
    image: neo4j:5.15.0-community
    ports:
      - "7474:7474"  # Browser interface
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_connector_bolt_tls__level=DISABLED
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    networks:
      - cognitive-network

  # ==========================================================================
  # REDIS CACHE
  # ==========================================================================
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=
      - REDIS_MAXMEMORY=256mb
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb
    restart: unless-stopped
    networks:
      - cognitive-network

  # ==========================================================================
  # GLOBE SERVICE (Cesium)
  # ==========================================================================
  globe:
    build:
      context: platform/platform
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - CESIUM_TOKEN=${CESIUM_TOKEN:-}
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - cognitive-network

  # ==========================================================================
  # PIPELINE SERVICE
  # ==========================================================================
  pipeline:
    build:
      context: platform/pipeline-server
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=8001
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_URL=redis://redis:6379
    depends_on:
      - neo4j
      - redis
      - api
    restart: unless-stopped
    networks:
      - cognitive-network

  # ==========================================================================
  # MONITORING (Optional)
  # ==========================================================================
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   restart: unless-stopped
  #   networks:
  #     - cognitive-network
  #
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3001:3000"
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   restart: unless-stopped
  #   networks:
  #     - cognitive-network

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:
  # grafana_data:

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  cognitive-network:
    driver: bridge
